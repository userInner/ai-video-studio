name: ai-video-studio

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      ASSET_ROOT: /app/data/assets
      WHITEBOARD_RENDERER_ROOT: /app/vendor/srt-whiteboard-animation
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      PREFER_LOCAL_QWEN_TTS: "false"
      ALLOW_NATIVE_TTS_FALLBACK: "false"
    volumes:
      - ./data:/app/data
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8010}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
